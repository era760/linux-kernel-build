name: Build Linux Kernel

on:
  workflow_dispatch:

  push:
    paths:
      - "config/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    name: Linux 6.18 + ntsync
    runs-on: ubuntu-24.04

    env:
      KERNEL_VERSION: "6.18"
      LOCALVERSION: "-ntsync"

    steps:
      # ------------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Install build dependencies
      # ------------------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves \
            fakeroot \
            dpkg-dev \
            rsync \
            cpio \
            kmod \
            libdw-dev \
            libcap-dev

      # ------------------------------------------------------------
      # Download Linux kernel
      # ------------------------------------------------------------
      - name: Clone Linux kernel
        run: |
          git clone \
            --depth=1 \
            --branch "v${KERNEL_VERSION}" \
            https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git \
            linux

          cd linux

          echo "=== Kernel source ==="
          git describe --tags --always

      # ------------------------------------------------------------
      # Configure kernel
      # ------------------------------------------------------------
      - name: Configure kernel
        run: |
          cd linux

          echo "=== Copying configuration ==="

          cp ../config/config-6.18-ubuntu2204-ntsync .config

          # ----------------------------------------------------------
          # Remove Ubuntu/Canonical-specific certificate references.
          #
          # The configuration came from Ubuntu, while this is a
          # vanilla kernel.org source tree.
          # ----------------------------------------------------------

          sed -i \
            's|^CONFIG_SYSTEM_TRUSTED_KEYS=.*|CONFIG_SYSTEM_TRUSTED_KEYS=""|' \
            .config

          sed -i \
            's|^CONFIG_SYSTEM_REVOCATION_KEYS=.*|CONFIG_SYSTEM_REVOCATION_KEYS=""|' \
            .config

          # ----------------------------------------------------------
          # Let Linux 6.18 resolve any changed/obsolete symbols.
          # ----------------------------------------------------------

          echo "=== Running olddefconfig ==="

          make olddefconfig

          echo
          echo "=== Important configuration ==="

          grep '^CONFIG_NTSYNC=' .config || true
          grep '^CONFIG_HZ=' .config || true
          grep '^CONFIG_PREEMPT=' .config || true
          grep '^CONFIG_SYSTEM_TRUSTED_KEYS=' .config || true
          grep '^CONFIG_SYSTEM_REVOCATION_KEYS=' .config || true

          echo

          # ----------------------------------------------------------
          # Hard requirement for this build.
          # ----------------------------------------------------------

          if ! grep -q '^CONFIG_NTSYNC=y$' .config; then
            echo "ERROR: CONFIG_NTSYNC=y is not enabled!"
            exit 1
          fi

          # Make sure the Ubuntu certificate paths are gone.
          if grep -q 'debian/canonical-certs.pem' .config; then
            echo "ERROR: Ubuntu canonical certificate reference remains!"
            exit 1
          fi

          echo "CONFIG_NTSYNC=y confirmed."
          echo "Kernel configuration is ready."

      # ------------------------------------------------------------
      # Build kernel
      # ------------------------------------------------------------
      - name: Build kernel
        run: |
          cd linux

          echo "========================================"
          echo " Starting Linux kernel build"
          echo "========================================"

          echo "CPU threads:"
          nproc

          echo
          echo "Kernel version:"
          make -s kernelversion

          echo
          echo "Starting compilation..."

          make -j"$(nproc)" \
            LOCALVERSION="${LOCALVERSION}" \
            bzImage \
            modules

          echo
          echo "========================================"
          echo " Kernel build finished"
          echo "========================================"

      # ------------------------------------------------------------
      # Build Debian packages
      # ------------------------------------------------------------
      - name: Build Debian packages
        run: |
          cd linux

          echo "========================================"
          echo " Building Debian packages"
          echo "========================================"

          make -j"$(nproc)" \
            LOCALVERSION="${LOCALVERSION}" \
            bindeb-pkg

          echo
          echo "========================================"
          echo " Debian package build finished"
          echo "========================================"

      # ------------------------------------------------------------
      # Show generated packages
      # ------------------------------------------------------------
      - name: List generated packages
        run: |
          echo "=== Generated Debian packages ==="

          ls -lh ../*.deb

          echo
          echo "=== Package names ==="

          find .. -maxdepth 1 -type f -name '*.deb' -printf '%f\n'

      # ------------------------------------------------------------
      # Upload kernel packages
      # ------------------------------------------------------------
      - name: Upload kernel packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-6.18-ntsync
          path: "*.deb"
          if-no-files-found: error
          retention-days: 14
