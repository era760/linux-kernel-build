name: Build custom Linux kernel

on:
  workflow_dispatch:
  push:
    paths:
      - "config/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

env:
  KERNEL_VERSION: "6.18"
  LOCALVERSION: "-ntsync"

jobs:
  build-kernel:
    name: name: Build custom Linux kernel
    runs-on: ubuntu-24.04

    steps:
      # ============================================================
      # 1. Checkout this repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Show repository contents
      #    Useful for diagnosing path mistakes.
      # ============================================================
      - name: Show repository
        shell: bash
        run: |
          set -eux

          echo "Working directory:"
          pwd

          echo
          echo "Repository root:"
          ls -la

          echo
          echo "Configuration files:"
          find config -maxdepth 2 -type f -print 2>/dev/null || true

      # ============================================================
      # 3. Install kernel build dependencies
      # ============================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves \
            cpio \
            rsync \
            kmod \
            fakeroot \
            dpkg-dev \
            debhelper \
            libdw-dev \
            libcap-dev \
            python3

      # ============================================================
      # 4. Download Linux kernel source
      # ============================================================
      - name: Clone Linux kernel
        shell: bash
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch "v${KERNEL_VERSION}" \
            https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git \
            linux

          test -d linux
          test -f linux/Makefile

          echo
          echo "Kernel source version:"
          cd linux
          make -s kernelversion

      # ============================================================
      # 5. Locate custom configuration
      #
      # Expected repository layout:
      #
      #   config/
      #     config-6.18-minta-ntsync
      # ============================================================
      - name: Locate kernel configuration
        shell: bash
        run: |
          set -eux

          CONFIG_FILE="config/config-6.18-minta-ntsync"

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "ERROR: configuration file not found:"
            echo "  $CONFIG_FILE"
            echo
            echo "Available files:"
            find config -maxdepth 2 -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "Using configuration:"
          echo "  $CONFIG_FILE"

      # ============================================================
      # 6. Apply custom configuration
      # ============================================================
      - name: Configure kernel
        shell: bash
        run: |
          set -eux

          cd linux

          cp ../config/config-6.18-minta-ntsync .config

          echo "Running olddefconfig..."

          make olddefconfig

          echo
          echo "=== Important configuration ==="

          grep -E \
            '^(CONFIG_NTSYNC|CONFIG_X86_64|CONFIG_64BIT|CONFIG_HZ|CONFIG_SYSTEM_TRUSTED_KEYS|CONFIG_SYSTEM_REVOCATION_KEYS)=' \
            .config || true

          echo
          echo "=== NTSYNC ==="

          if grep -q '^CONFIG_NTSYNC=y$' .config; then
            echo "CONFIG_NTSYNC=y confirmed."
          else
            echo "ERROR: CONFIG_NTSYNC=y is not enabled."
            exit 1
          fi

      # ============================================================
      # 7. Verify configuration after olddefconfig
      # ============================================================
      - name: Verify kernel configuration
        shell: bash
        run: |
          set -eux

          cd linux

          echo "Kernel version:"
          make -s kernelversion

          echo
          echo "NTSYNC:"
          grep '^CONFIG_NTSYNC=' .config

          echo
          echo "64-bit:"
          grep -E '^CONFIG_(64BIT|X86_64)=' .config || true

          test "$(grep '^CONFIG_NTSYNC=' .config)" = "CONFIG_NTSYNC=y"

      # ============================================================
      # 8. Build kernel + modules
      #
      # IMPORTANT:
      # This is separate from bindeb-pkg.
      # If packaging fails later, this stage remains successful.
      # ============================================================
      - name: Build kernel
        shell: bash
        run: |
          set -eux

          cd linux

          echo "========================================"
          echo " Starting kernel build"
          echo "========================================"

          echo "Kernel:"
          make -s kernelversion

          echo "CPU threads:"
          nproc

          echo
          echo "Compiling..."

          make \
            -j"$(nproc)" \
            bzImage \
            modules \
            LOCALVERSION="${LOCALVERSION}"

          echo
          echo "========================================"
          echo " Kernel build completed"
          echo "========================================"

          test -f arch/x86/boot/bzImage

          ls -lh arch/x86/boot/bzImage

      # ============================================================
      # 9. Save kernel configuration
      # ============================================================
      - name: Save kernel build metadata
        shell: bash
        run: |
          set -eux

          cd linux

          mkdir -p ../kernel-artifact

          cp arch/x86/boot/bzImage \
            ../kernel-artifact/bzImage

          cp .config \
            ../kernel-artifact/.config

          make -s kernelrelease \
            > ../kernel-artifact/kernelrelease.txt

          git describe --always --dirty \
            > ../kernel-artifact/kernel-source.txt

          echo "Kernel release:"
          cat ../kernel-artifact/kernelrelease.txt

      # ============================================================
      # 10. Upload kernel immediately
      #
      # This happens BEFORE Debian packaging.
      # ============================================================
      - name: Upload kernel artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ env.KERNEL_VERSION }}-ntsync-kernel
          retention-days: 14
          if-no-files-found: error
          path: kernel-artifact/

      # ============================================================
      # 11. Stage modules separately
      # ============================================================
      - name: Stage kernel modules
        shell: bash
        run: |
          set -eux

          cd linux

          rm -rf ../modules-artifact

          make \
            modules_install \
            INSTALL_MOD_PATH="$GITHUB_WORKSPACE/modules-artifact" \
            LOCALVERSION="${LOCALVERSION}"

          echo
          echo "Module size:"
          du -sh ../modules-artifact

      # ============================================================
      # 12. Upload modules
      # ============================================================
      - name: Upload module artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ env.KERNEL_VERSION }}-ntsync-modules
          retention-days: 14
          if-no-files-found: error
          path: modules-artifact/

      # ============================================================
      # 13. Attempt Debian packaging
      #
      # Packaging is allowed to fail without destroying the
      # successful kernel artifacts.
      # ============================================================
      - name: Build Debian packages
        id: deb
        continue-on-error: true
        shell: bash
        run: |
          set -eux

          cd linux

          echo "========================================"
          echo " Building Debian packages"
          echo "========================================"

          make \
            bindeb-pkg \
            LOCALVERSION="${LOCALVERSION}"

      # ============================================================
      # 14. List generated packages
      # ============================================================
      - name: List Debian packages
        if: steps.deb.outcome == 'success'
        shell: bash
        run: |
          set -eux

          echo "Generated packages:"

          find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type f \
            \( -name '*.deb' -o -name '*.changes' -o -name '*.dsc' \) \
            -print

      # ============================================================
      # 15. Upload Debian packages if successful
      # ============================================================
      - name: Upload Debian package artifact
        if: steps.deb.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ env.KERNEL_VERSION }}-ntsync-debs
          retention-days: 30
          if-no-files-found: error
          path: |
            *.deb
            *.changes
            *.dsc
            ../*.deb
            ../*.changes
            ../*.dsc

      # ============================================================
      # 16. Report packaging status
      # ============================================================
      - name: Report packaging result
        shell: bash
        run: |
          if [ "${{ steps.deb.outcome }}" = "success" ]; then
            echo "========================================"
            echo " Debian packaging succeeded."
            echo "========================================"
          else
            echo "========================================"
            echo " Kernel build succeeded."
            echo " Debian packaging failed."
            echo " Kernel artifacts are already safe."
            echo "========================================"
          fi
