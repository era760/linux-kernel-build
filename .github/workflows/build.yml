name: Build Linux kernel with NTSYNC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Install build dependencies
      # ============================================================
      - name: Install kernel build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves \
            cpio \
            fakeroot \
            rsync \
            kmod \
            libdw-dev \
            debhelper

      # ============================================================
      # 3. Check source tree
      # ============================================================
      - name: Check kernel source
        run: |
          test -d linux
          test -f linux/Makefile

          echo "Kernel source:"
          cd linux
          make kernelversion

      # ============================================================
      # 4. Prepare configuration
      # ============================================================
      - name: Prepare kernel configuration
        run: |
          cd linux

          # --------------------------------------------------------
          # Use the existing Ubuntu config if available.
          # Otherwise start from the kernel's default x86_64 config.
          # --------------------------------------------------------
          if [ -f ../config-6.8.0-136-generic ]; then
            cp ../config-6.8.0-136-generic .config
          elif [ -f ../config ]; then
            cp ../config .config
          else
            make x86_64_defconfig
          fi

          # --------------------------------------------------------
          # Required for NTSYNC
          # --------------------------------------------------------
          scripts/config --enable NTSYNC

          # Avoid Ubuntu/Canonical certificate files that are not
          # present in the upstream source tree.
          scripts/config --disable SYSTEM_TRUSTED_KEYS
          scripts/config --disable SYSTEM_REVOCATION_KEYS

          # Keep a reasonably responsive desktop-oriented tick rate.
          scripts/config --set-val HZ 1000

          echo "Running olddefconfig..."
          make olddefconfig

          echo
          echo "=== Important configuration ==="
          grep -E '^(CONFIG_NTSYNC|CONFIG_HZ|CONFIG_SYSTEM_TRUSTED_KEYS|CONFIG_SYSTEM_REVOCATION_KEYS)=' .config

          echo
          echo "=== NTSYNC check ==="
          grep -q '^CONFIG_NTSYNC=y$' .config
          echo "CONFIG_NTSYNC=y confirmed."

      # ============================================================
      # 5. Build kernel + modules
      #
      # This is the expensive part.
      # Do NOT combine this with bindeb-pkg.
      # ============================================================
      - name: Build kernel
        run: |
          cd linux

          echo "========================================"
          echo " Building Linux kernel"
          echo "========================================"

          make -j"$(nproc)" \
            bzImage \
            modules \
            LOCALVERSION=-ntsync

          echo
          echo "========================================"
          echo " Kernel build completed"
          echo "========================================"

          ls -lh arch/x86/boot/bzImage

          echo
          echo "Kernel release:"
          make -s kernelrelease

      # ============================================================
      # 6. Save kernel immediately
      #
      # If Debian packaging explodes later, THIS artifact survives.
      # ============================================================
      - name: Upload kernel artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: linux-6.18-ntsync-kernel
          retention-days: 14
          if-no-files-found: error
          path: |
            linux/arch/x86/boot/bzImage
            linux/.config

      # ============================================================
      # 7. Install modules into a staging directory
      #
      # This is still independent of Debian packaging.
      # ============================================================
      - name: Stage kernel modules
        run: |
          cd linux

          rm -rf ../kernel-modules

          make modules_install \
            INSTALL_MOD_PATH="$GITHUB_WORKSPACE/kernel-modules" \
            LOCALVERSION=-ntsync

          echo "=== Staged modules ==="
          du -sh ../kernel-modules

      # ============================================================
      # 8. Upload modules separately
      # ============================================================
      - name: Upload kernel modules
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: linux-6.18-ntsync-modules
          retention-days: 14
          if-no-files-found: error
          path: |
            kernel-modules/

      # ============================================================
      # 9. Debian package build
      #
      # If this fails, the two artifacts above are already safe.
      # ============================================================
      - name: Build Debian packages
        id: deb_build
        continue-on-error: true
        run: |
          cd linux

          echo "========================================"
          echo " Building Debian packages"
          echo "========================================"

          make -j"$(nproc)" bindeb-pkg \
            LOCALVERSION=-ntsync

      # ============================================================
      # 10. Find generated Debian packages
      # ============================================================
      - name: List Debian packages
        if: steps.deb_build.outcome == 'success'
        run: |
          echo "=== Generated packages ==="
          find . .. -maxdepth 2 \
            -type f \
            \( -name '*.deb' -o -name '*.changes' -o -name '*.dsc' \) \
            -print

      # ============================================================
      # 11. Upload Debian packages ONLY if packaging succeeded
      # ============================================================
      - name: Upload Debian packages
        if: steps.deb_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: linux-6.18-ntsync-debs
          retention-days: 30
          if-no-files-found: error
          path: |
            *.deb
            *.changes
            *.dsc
            ../*.deb
            ../*.changes
            ../*.dsc

      # ============================================================
      # 12. Show packaging failure but don't hide it
      # ============================================================
      - name: Report Debian packaging failure
        if: steps.deb_build.outcome == 'failure'
        run: |
          echo
          echo "================================================"
          echo " Kernel build succeeded."
          echo " Debian packaging failed."
          echo " Kernel artifacts were already uploaded."
          echo "================================================"
          echo
          echo "The kernel itself is NOT considered a failed build."
          echo "Inspect the packaging error above."

      # ============================================================
      # 13. Final status
      # ============================================================
      - name: Final result
        run: |
          echo "========================================"
          echo " Kernel build pipeline finished"
          echo "========================================"

          echo "Kernel artifact:"
          echo "  linux-6.18-ntsync-kernel"

          echo "Module artifact:"
          echo "  linux-6.18-ntsync-modules"

          if [ "${{ steps.deb_build.outcome }}" = "success" ]; then
            echo "Debian artifact:"
            echo "  linux-6.18-ntsync-debs"
          else
            echo "Debian packaging:"
            echo "  FAILED (kernel artifacts are safe)"
          fi
