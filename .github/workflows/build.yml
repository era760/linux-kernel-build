name: Build custom Linux kernel

on:
  workflow_dispatch:
  push:
    paths:
      - "config/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

env:
  KERNEL_VERSION: "6.18"
  LOCALVERSION: "-ntsync"

jobs:
  build-kernel:
    name: Build Linux kernel
    runs-on: ubuntu-24.04

    steps:
      # ==========================================================
      # 1. Checkout repository
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Show repository structure
      # ==========================================================
      - name: Verify repository
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository:"
          pwd

          echo
          echo "Top-level files:"
          ls -la

          echo
          echo "Configuration files:"
          find config -maxdepth 2 -type f -print 2>/dev/null || true

      # ==========================================================
      # 3. Install dependencies
      # ==========================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            dwarves \
            cpio \
            rsync \
            kmod \
            fakeroot \
            dpkg-dev \
            debhelper \
            python3 \
            perl \
            pahole

      # ==========================================================
      # 4. Download Linux kernel source
      # ==========================================================
      - name: Download Linux kernel source
        shell: bash
        run: |
          set -euo pipefail

          echo "Downloading Linux ${KERNEL_VERSION}..."

          git clone \
            --depth=1 \
            --branch "v${KERNEL_VERSION}" \
            https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git \
            linux

          test -d linux
          test -f linux/Makefile

          cd linux

          echo
          echo "Kernel source version:"
          make -s kernelversion

      # ==========================================================
      # 5. Check custom configuration
      # ==========================================================
      - name: Check custom configuration
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_FILE="config/config-6.18-minta-ntsync"

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "::error::Configuration file not found: $CONFIG_FILE"
            echo
            echo "Available configuration files:"
            find config -maxdepth 2 -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "Using:"
          echo "$CONFIG_FILE"

      # ==========================================================
      # 6. Apply configuration
      # ==========================================================
      - name: Configure kernel
        shell: bash
        run: |
          set -euo pipefail

          cd linux

          cp "../config/config-6.18-minta-ntsync" .config

          echo "Running olddefconfig..."

          make olddefconfig

          echo
          echo "Important configuration:"
          grep -E \
            '^(CONFIG_NTSYNC|CONFIG_64BIT|CONFIG_X86_64|CONFIG_HZ)=' \
            .config || true

      # ==========================================================
      # 7. Force build-environment-specific options
      #
      # Avoid requiring Canonical's signing certificate files.
      # ==========================================================
      - name: Prepare kernel configuration
        shell: bash
        run: |
          set -euo pipefail

          cd linux

          ./scripts/config \
            --disable SYSTEM_TRUSTED_KEYS \
            --disable SYSTEM_REVOCATION_KEYS

          make olddefconfig

      # ==========================================================
      # 8. Verify configuration
      # ==========================================================
      - name: Verify configuration
        shell: bash
        run: |
          set -euo pipefail

          cd linux

          echo "Kernel version:"
          make -s kernelversion

          echo
          echo "Kernel release:"
          make -s kernelrelease

          echo
          echo "NTSYNC:"
          grep '^CONFIG_NTSYNC=' .config

          if ! grep -q '^CONFIG_NTSYNC=y$' .config; then
            echo "::error::CONFIG_NTSYNC=y is not enabled!"
            exit 1
          fi

          echo
          echo "64-bit configuration:"
          grep -E '^CONFIG_(64BIT|X86_64)=' .config || true

          echo
          echo "Certificate configuration:"
          grep -E '^CONFIG_SYSTEM_(TRUSTED_KEYS|REVOCATION_KEYS)=' .config || true

          echo
          echo "CONFIG_NTSYNC=y confirmed."

      # ==========================================================
      # 9. Build kernel
      #
      # No packaging yet.
      # First make absolutely sure the kernel itself builds.
      # ==========================================================
      - name: Build kernel
        shell: bash
        run: |
          set -euo pipefail

          cd linux

          echo "========================================"
          echo " Building Linux kernel"
          echo "========================================"

          echo "Version:"
          make -s kernelrelease

          echo
          echo "CPU threads:"
          nproc

          echo
          echo "Starting build..."

          make \
            -j"$(nproc)" \
            bzImage \
            modules \
            LOCALVERSION="${LOCALVERSION}"

          echo
          echo "========================================"
          echo " Kernel build successful"
          echo "========================================"

          test -f arch/x86/boot/bzImage

          ls -lh arch/x86/boot/bzImage

      # ==========================================================
      # 10. Prepare kernel artifact
      # ==========================================================
      - name: Prepare kernel artifact
        shell: bash
        run: |
          set -euo pipefail

          cd linux

          rm -rf "$GITHUB_WORKSPACE/kernel-artifact"
          mkdir -p "$GITHUB_WORKSPACE/kernel-artifact"

          cp arch/x86/boot/bzImage \
            "$GITHUB_WORKSPACE/kernel-artifact/bzImage"

          cp .config \
            "$GITHUB_WORKSPACE/kernel-artifact/config"

          make -s kernelrelease \
            > "$GITHUB_WORKSPACE/kernel-artifact/kernelrelease.txt"

          echo "Linux ${KERNEL_VERSION}" \
            > "$GITHUB_WORKSPACE/kernel-artifact/source.txt"

          echo "LOCALVERSION=${LOCALVERSION}" \
            >> "$GITHUB_WORKSPACE/kernel-artifact/source.txt"

          echo
          echo "Artifact:"
          find "$GITHUB_WORKSPACE/kernel-artifact" \
            -maxdepth 1 \
            -type f \
            -printf '%f %s bytes\n'

      # ==========================================================
      # 11. Upload kernel artifact immediately
      # ==========================================================
      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ env.KERNEL_VERSION }}-ntsync-kernel
          path: kernel-artifact/
          if-no-files-found: error
          retention-days: 30

      # ==========================================================
      # 12. Stage modules
      # ==========================================================
      - name: Install modules into staging directory
        shell: bash
        run: |
          set -euo pipefail

          cd linux

          rm -rf "$GITHUB_WORKSPACE/modules-artifact"

          make \
            modules_install \
            INSTALL_MOD_PATH="$GITHUB_WORKSPACE/modules-artifact" \
            LOCALVERSION="${LOCALVERSION}"

          echo
          echo "Modules:"
          du -sh "$GITHUB_WORKSPACE/modules-artifact"

      # ==========================================================
      # 13. Upload modules
      # ==========================================================
      - name: Upload modules artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ env.KERNEL_VERSION }}-ntsync-modules
          path: modules-artifact/
          if-no-files-found: error
          retention-days: 30

      # ==========================================================
      # 14. Build Debian packages
      #
      # This is intentionally AFTER the kernel artifact upload.
      # If this fails, the kernel is still available.
      # ==========================================================
      - name: Build Debian packages
        id: deb
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          cd linux

          echo "========================================"
          echo " Building Debian packages"
          echo "========================================"

          make \
            -j"$(nproc)" \
            bindeb-pkg \
            LOCALVERSION="${LOCALVERSION}"

      # ==========================================================
      # 15. Collect Debian packages
      # ==========================================================
      - name: Collect Debian packages
        if: steps.deb.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p deb-artifact

          find "$GITHUB_WORKSPACE" \
            -maxdepth 3 \
            -type f \
            -name '*.deb' \
            -exec cp {} deb-artifact/ \;

          echo
          echo "Generated Debian packages:"
          find deb-artifact \
            -maxdepth 1 \
            -type f \
            -printf '%f %s bytes\n'

          test -n "$(find deb-artifact -maxdepth 1 -name '*.deb' -print -quit)"

      # ==========================================================
      # 16. Upload Debian packages
      # ==========================================================
      - name: Upload Debian packages
        if: steps.deb.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ env.KERNEL_VERSION }}-ntsync-debs
          path: deb-artifact/
          if-no-files-found: error
          retention-days: 30

      # ==========================================================
      # 17. Final status
      # ==========================================================
      - name: Final status
        shell: bash
        run: |
          if [ "${{ steps.deb.outcome }}" = "success" ]; then
            echo
            echo "========================================"
            echo " ALL BUILD STAGES SUCCEEDED"
            echo "========================================"
            echo
            echo "Kernel:      SUCCESS"
            echo "Modules:     SUCCESS"
            echo "Debian pkg:  SUCCESS"
          else
            echo
            echo "========================================"
            echo " KERNEL BUILD SUCCEEDED"
            echo "========================================"
            echo
            echo "Kernel:      SUCCESS"
            echo "Modules:     SUCCESS"
            echo "Debian pkg:  FAILED"
            echo
            echo "The kernel and modules artifacts are safe."
          fi
